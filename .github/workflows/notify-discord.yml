name: Discord Notifications

on:
  workflow_run:
    workflows:
      - "Code Quality"
      - "Tests"
      - "Lint Commit Messages & PR Title"
    types: [completed]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    # Nur Erfolg oder Fehler melden (abgebrochene/übersprungene Läufe ignorieren)
    if: contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)

    steps:
      - name: Discord benachrichtigen
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ "$CONCLUSION" = "success" ]; then
            TEXT="✅ **$WF_NAME** erfolgreich auf \`$BRANCH\` – [Zum Workflow]($RUN_URL)"
          else
            TEXT="❌ **$WF_NAME** fehlgeschlagen auf \`$BRANCH\` – [Zum Workflow]($RUN_URL)"
          fi

          jq -n --arg content "$TEXT" '{content: $content, flags: 4}' \
          | curl -sS --fail-with-body -H "Content-Type: application/json" -d @- "$WEBHOOK"