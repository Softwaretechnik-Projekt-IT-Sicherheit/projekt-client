name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

        # fastecdsa (via bitcoinlib) braucht GMP
      - name: Systemabhängigkeiten installieren (GMP, Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev

      - name: Systemabhängigkeiten installieren (GMP, macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gmp
          echo "CFLAGS=-I$(brew --prefix gmp)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix gmp)/lib" >> "$GITHUB_ENV"

      - name: uv installieren
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Dependencies installieren
        run: uv sync --locked

      - name: Tests ausführen (pytest + Coverage)
        run: uv run pytest --cov=wallet --cov-report=term-missing

      - name: Smoke-Test – startet die Anwendung fehlerfrei?
        run: uv run python -m wallet --version