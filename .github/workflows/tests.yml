name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: uv installieren
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Dependencies installieren
        run: uv sync --locked

      - name: Tests ausführen (pytest + Coverage)
        run: uv run pytest --cov=wallet --cov-report=term-missing

      - name: Smoke-Test – startet die Anwendung fehlerfrei?
        run: uv run python -m wallet --version