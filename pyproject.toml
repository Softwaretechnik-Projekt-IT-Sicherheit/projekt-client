[project]
name = "wallet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lenny Fuchs", email = "lenny.fuchs@outlook.de" }
]
requires-python = ">=3.14"
dependencies = [
    "bitcoinlib==0.7.10",
    "cryptography>=50.0.2",
    "platformdirs==4.14.8",
    "python-dotenv>=1.0.0",
    "requests>=2.34.2",
]

[project.scripts]
wallet = "wallet.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "types-requests>=2.33.0.20261030",
]


[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # Pyflakes (unbenutzte Imports, undefinierte Namen)
    "I",        # Import-Sortierung
    "B",        # Bugbear (typische Bug-Muster)
    "UP",       # moderne Python-Syntax
    "SIM",      # Vereinfachungen
    "S",        # Bandit: Security-Regeln
    "N",        # Namenskonventionen
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert ist in Tests erlaubt

[tool.mypy]
strict = true
packages = ["wallet"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["bitcoinlib", "bitcoinlib.*"]   # bitcoinlib liefert keine Typinformationen
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# testnet-Integrationstests laufen nicht standardmäßig (CI bleibt offline): npm run test:testnet
addopts = "-ra --strict-markers -m 'not testnet'"
markers = [
    "smoke: Starttest, NotImplementedError wird hier nie als xfail gewertet",
    "testnet: Integrationstests gegen das echte testnet4 (benötigen Netzwerkzugriff)",
]

[tool.coverage.run]
branch = true
source = ["wallet"]

[tool.coverage.report]
show_missing = true
exclude_also = ["raise NotImplementedError"]
# fail_under = 80   # aktivieren, sobald es nennenswert Code gibt