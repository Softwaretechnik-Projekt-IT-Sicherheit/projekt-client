[project]
name = "wallet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lenny Fuchs", email = "lenny.fuchs@outlook.de" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
wallet = "wallet:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

# ─── Diese Abschnitte unten an deine pyproject.toml anhängen ───

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # Pyflakes (unbenutzte Imports, undefinierte Namen)
    "I",        # Import-Sortierung
    "B",        # Bugbear (typische Bug-Muster)
    "UP",       # moderne Python-Syntax
    "SIM",      # Vereinfachungen
    "S",        # Bandit: Security-Regeln
    "N",        # Namenskonventionen
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert ist in Tests erlaubt

[tool.mypy]
strict = true
packages = ["hot_wallet"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["hot_wallet"]

[tool.coverage.report]
show_missing = true
# fail_under = 80   # aktivieren, sobald es nennenswert Code gibt